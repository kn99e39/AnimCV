services:
  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    image: animcv-train:cuda118
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    working_dir: /workspace/AnimCV
    volumes:
      - .:/workspace/AnimCV
      - ${ANIMCV_DATA_ROOT:?Set ANIMCV_DATA_ROOT to the host dataset directory}:/data:ro
      - ${ANIMCV_OUTPUT_ROOT:?Set ANIMCV_OUTPUT_ROOT to a writable host output directory}:/output
    environment:
      PYTHONUNBUFFERED: "1"
